---
- name: Build Frontend Locally
  hosts: local
  tasks:

    # Build the frontend locally
    - name: Build frontend
      shell: |
        npm ci && npm run build
      args:
        chdir: "{{ playbook_dir }}"
      when: not (skip_frontend | default(false))


- name: Deploy Updates To Server
  hosts: app_servers
  become: yes
  vars:
    project_path: /var/www/ComputerScienceResources.com
    repo_url: git@github.com:AllanKoder/ComputerScienceResources.com.git

  tasks:
    - name: Ensure project directory exists
      file:
        path: "{{ project_path }}/public"
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data

    - name: Push frontend as new_build
      synchronize:
        src: "{{ playbook_dir }}/public/build/"
        dest: "{{ project_path }}/public/new_build/"
        recursive: yes
      when: not (skip_frontend | default(false))

    - name: Backup database
      command: php artisan backup:run --only-db
      args:
        chdir: "{{ project_path }}"
      when: not (skip_backup | default(false))

    - name: Bring app down
      command: php artisan down
      args:
        chdir: "{{ project_path }}"

    - name: Update code
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: master
        force: yes

    - name: Install Composer dependencies
      command: composer install --no-dev --optimize-autoloader --no-interaction
      args:
        chdir: "{{ project_path }}"
      environment:
        COMPOSER_ALLOW_SUPERUSER: "1"
        COMPOSER_MEMORY_LIMIT: "-1"

    - name: Run migrations
      command: php artisan migrate --force
      args:
        chdir: "{{ project_path }}"

    - name: Remove old build directory
      file:
        path: "{{ project_path }}/public/build"
        state: absent
      when: not (skip_frontend | default(false))

    - name: Swap new_build into build
      command: mv {{ project_path }}/public/new_build {{ project_path }}/public/build
      when: not (skip_frontend | default(false))

    - name: Optimize caches
      command: php artisan {{ item }}
      args:
        chdir: "{{ project_path }}"
      loop:
        - cache:clear
        - config:cache
        - route:cache
        - view:cache

    - name: Bring app up
      command: php artisan up
      args:
        chdir: "{{ project_path }}"
